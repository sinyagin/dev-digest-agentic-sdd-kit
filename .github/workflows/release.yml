name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # Tags every plugin whose plugin.json version has no <plugin>--v<version> tag yet.
      - name: Tag releases and create GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/tag-releases.mjs --push --github-release
